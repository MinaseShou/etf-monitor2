name: Daily ETF Monitor

on:
  schedule:
    # 每天台灣時間 18:00 執行 (UTC 10:00)
    - cron: '0 10 * * *'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETF monitor (with log capture)
        run: |
          python monitor_active_etfs.py 2>&1 | tee run_log.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Generate status page (if report not yet available)
        run: |
          RUN_TIME=$(TZ='Asia/Taipei' date +'%Y-%m-%d %H:%M:%S')
          RUN_DATE=$(date +'%Y%m%d')
          LOG_CONTENT=$(cat run_log.txt | sed 's/</\&lt;/g; s/>/\&gt;/g')
          STATUS="success"
          STATUS_COLOR="#28a745"
          if grep -qi "error\|failed\|warning" run_log.txt; then
            STATUS="check log"
            STATUS_COLOR="#ffc107"
          fi

          # Generate index.html if the script didn't create one
          if [ ! -f index.html ]; then
            cat > index.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="zh-TW">
          <head>
            <meta charset="UTF-8">
            <title>Active ETF Monitor</title>
            <style>
              body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
              .status { display: inline-block; padding: 4px 12px; border-radius: 12px; color: white; background: ${STATUS_COLOR}; font-weight: bold; }
              .log { background: #1e1e1e; color: #d4d4d4; padding: 20px; border-radius: 6px; white-space: pre-wrap; font-family: monospace; font-size: 13px; overflow-x: auto; }
              h1 { color: #333; }
              .meta { color: #666; margin-bottom: 20px; }
            </style>
          </head>
          <body>
            <h1>Active ETF Monitor</h1>
            <p class="meta">
              最後執行時間 (台灣時間)：<strong>${RUN_TIME}</strong>
              &nbsp;&nbsp;狀態：<span class="status">${STATUS}</span>
            </p>
            <p>資料已儲存至 <code>etf_data/etf_holdings_${RUN_DATE}.csv</code></p>
            <p><em>比較報告需要至少兩天的資料，明天執行後將自動產生 HTML 報告。</em></p>
            <h2>執行日誌</h2>
            <div class="log">${LOG_CONTENT}</div>
          </body>
          </html>
          HTMLEOF
            echo "Created fallback index.html"
          else
            echo "index.html already generated by script"
          fi

      - name: Upload execution log as artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_number }}
          path: run_log.txt
          retention-days: 30

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etf_data/ index.html || true
          git diff --cached --quiet || git commit -m "chore: update ETF data $(date +'%Y-%m-%d')"
          git push origin main
